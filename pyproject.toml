[project]
name = "sherpaos"
version = "0.1.0"
description = "Offline, auditable mobility-risk supervisor for Unitree G1."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mujoco>=3.1.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "matplotlib>=3.8",
]

[project.scripts]
sherpa = "sherpaos.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sherpaos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "property: hypothesis property-based tests",
    "integration: end-to-end integration tests",
    "regression: seed-reproduced failure regressions",
    "leakage: tests asserting no simulator ground truth reaches runtime features",
]
